<title>华文小岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* ============ 设计 token：浅色 = 护眼绿作业本 ============ */
:root{
  --bg:#E3EDD8;
  --paper:#F7FAF1;
  --ink:#1E2B22;
  --ink-soft:#526457;
  --line:#AEC29F;
  --accent:#D23B24;
  --good:#1F7A38;
  --bad:#BF3328;
  --gold:#E2A00C;
  --listen:#2A62AA;
  --speak:#BF5A10;
  --read:#0E7766;
  --write:#8A3A9E;
  --radius:8px;
  --shadow:0 2px 0 rgba(30,43,34,.13),0 8px 18px -12px rgba(30,43,34,.35);
  --font-display:"ZCOOL KuaiLe","Kaiti SC","STKaiti","KaiTi","楷体",sans-serif;
  --font-kai:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC",serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-py:"Helvetica Neue",Arial,sans-serif;
  /* 核心私有 token（游戏模块不要直接用） */
  --bg-grid:#D5E3C7;
  --paper-2:#EDF4E3;
  --grid:#E3877A;
  --rule:#C7D8B7;
  --track:#D3E1C5;
  --accent-deep:#A22A16;
  --on-accent:#FFF8F1;
  --good-bg:#D6EFD0;
  --bad-bg:#F9DDD6;
  --hz-outline:#D2DCCB;
  --cover:#2E6A54;
  --cover-2:#255845;
  --cover-ink:#F3F8EE;
  --label-bg:#FBFDF7;
  --flower:#E3402B;
  --btn-edge:#1E2B22;
  --focus:#2A62AA;
  --stamp-blend:multiply;
  color-scheme:light;
}
/* ============ 深色 = 黑板模式 ============ */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C3A2E;
    --paper:#23453A;
    --ink:#F1F0E6;
    --ink-soft:#B4C6B8;
    --line:#5E8472;
    --accent:#FF8468;
    --good:#9CE3A6;
    --bad:#FF9F90;
    --gold:#FFD36A;
    --listen:#93C6FF;
    --speak:#FFB879;
    --read:#80E0CA;
    --write:#E6AEF2;
    --shadow:0 2px 0 rgba(0,0,0,.32),0 10px 20px -14px rgba(0,0,0,.6);
    --bg-grid:#21402F;
    --paper-2:#284B3E;
    --grid:#C98677;
    --rule:#3A5F4E;
    --track:#315748;
    --accent-deep:#D0543C;
    --on-accent:#23130F;
    --good-bg:#2C5A42;
    --bad-bg:#583330;
    --hz-outline:#3E6454;
    --cover:#132820;
    --cover-2:#0F211A;
    --cover-ink:#F1F0E6;
    --label-bg:#1F3E33;
    --flower:#FF7C66;
    --btn-edge:#0D1D16;
    --focus:#FFD36A;
    --stamp-blend:normal;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C3A2E;
  --paper:#23453A;
  --ink:#F1F0E6;
  --ink-soft:#B4C6B8;
  --line:#5E8472;
  --accent:#FF8468;
  --good:#9CE3A6;
  --bad:#FF9F90;
  --gold:#FFD36A;
  --listen:#93C6FF;
  --speak:#FFB879;
  --read:#80E0CA;
  --write:#E6AEF2;
  --shadow:0 2px 0 rgba(0,0,0,.32),0 10px 20px -14px rgba(0,0,0,.6);
  --bg-grid:#21402F;
  --paper-2:#284B3E;
  --grid:#C98677;
  --rule:#3A5F4E;
  --track:#315748;
  --accent-deep:#D0543C;
  --on-accent:#23130F;
  --good-bg:#2C5A42;
  --bad-bg:#583330;
  --hz-outline:#3E6454;
  --cover:#132820;
  --cover-2:#0F211A;
  --cover-ink:#F1F0E6;
  --label-bg:#1F3E33;
  --flower:#FF7C66;
  --btn-edge:#0D1D16;
  --focus:#FFD36A;
  --stamp-blend:normal;
  color-scheme:dark;
}

/* ============ 页面底 ============ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font:16px/1.6 var(--font-body);
  min-height:100%;
  overflow-x:hidden;
}
#app{min-height:100%}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.hw-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important} /* .hw-btn 等带 display 的类会盖过 UA 的 [hidden]，游戏里 el.hidden=true 必须真的藏起来 */

.hw-shell{max-width:1100px;margin-inline:auto;padding-inline:16px;padding-block:12px 48px}

/* ============ 公共类（游戏模块可用） ============ */
.hw-stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.hw-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.hw-card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.hw-muted{color:var(--ink-soft)}
.hw-center{text-align:center;align-items:center;justify-content:center}
.hw-kai{font-family:var(--font-kai)}
.hw-py{font-family:var(--font-py);letter-spacing:.02em;color:var(--ink-soft)}
.hw-big{font-family:var(--font-kai);font-size:clamp(44px,13vw,76px);line-height:1.15;font-weight:400}
.hw-q{font-size:20px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.hw-passage{
  font-family:var(--font-kai);font-size:20px;line-height:2em;
  white-space:pre-line;overflow-wrap:anywhere;max-width:36em;
  padding:0 14px;margin:0;
  background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent calc(2em - 1px),var(--rule) calc(2em - 1px));
  background-size:100% 2em;background-attachment:local;
  border:1.5px solid var(--line);border-radius:var(--radius);
}
.hw-passage p{margin:0;text-indent:2em;white-space:normal}
.hw-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;line-height:1.6;border:1.5px solid currentColor;color:var(--ink-soft);white-space:nowrap;font-weight:600}
.hw-tag.listen{color:var(--listen)}.hw-tag.speak{color:var(--speak)}.hw-tag.read{color:var(--read)}.hw-tag.write{color:var(--write)}
.hw-tag.accent{color:var(--accent)}

/* 按钮：像橡皮章一样的厚边按钮 */
.hw-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;min-width:48px;padding:10px 18px;
  font-family:var(--font-body);font-size:17px;font-weight:700;line-height:1.2;
  color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:var(--radius);
  box-shadow:0 3px 0 var(--btn-edge);
  cursor:pointer;text-decoration:none;user-select:none;
  transition:transform .08s ease,box-shadow .08s ease,background-color .15s;
}
.hw-btn:hover{background:var(--paper-2)}
.hw-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);box-shadow:0 3px 0 var(--accent-deep)}
.hw-btn.primary:hover{filter:brightness(1.05)}
.hw-btn.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.hw-btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.hw-btn.ghost:hover{color:var(--ink);background:transparent}
.hw-btn.ghost:active{transform:none}
.hw-btn.big{min-height:60px;padding:14px 28px;font-size:21px}
.hw-btn:disabled,.hw-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--btn-edge)}
.hw-btn.primary:disabled{box-shadow:0 3px 0 var(--accent-deep)}

.hw-icon-btn{
  display:inline-grid;place-items:center;flex:none;
  width:56px;height:56px;border-radius:50%;padding:0;
  font-size:26px;line-height:1;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--btn-edge);
  cursor:pointer;position:relative;
  transition:transform .08s ease,box-shadow .08s ease;
}
.hw-icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-icon-btn:disabled{opacity:.45;cursor:not-allowed}
.hw-icon-btn.is-active,.hw-icon-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hw-icon-btn.is-active::after,.hw-icon-btn[aria-pressed="true"]::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:3px solid var(--accent);opacity:.5;animation:hw-ring 1.1s ease-out infinite;
}
.hw-icon-btn.sm{width:44px;height:44px;font-size:20px}

/* 选择题 */
.hw-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;counter-reset:hwc}
.hw-choice{
  position:relative;display:flex;align-items:center;gap:12px;
  min-height:54px;width:100%;padding:10px 44px 10px 12px;
  text-align:left;font-family:var(--font-body);font-size:18px;line-height:1.45;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:0 2px 0 var(--line);cursor:pointer;overflow-wrap:anywhere;
  transition:border-color .15s,background-color .15s,transform .08s,opacity .2s;
}
.hw-choice::before{
  counter-increment:hwc;content:counter(hwc,upper-alpha);
  flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  font:700 14px/1 var(--font-py);color:var(--ink-soft);border:1.5px solid var(--line);
}
.hw-choice:hover{border-color:var(--ink-soft)}
.hw-choice:active{transform:translateY(1px)}
.hw-choices.is-locked .hw-choice{cursor:default}
.hw-choice.is-right{border-color:var(--good);background:var(--good-bg);box-shadow:0 2px 0 var(--good)}
.hw-choice.is-right::before{color:var(--good);border-color:var(--good)}
.hw-choice.is-right::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:700 24px/1 var(--font-py);color:var(--good)}
.hw-choice.is-wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 2px 0 var(--bad);animation:hw-shake .35s ease}
.hw-choice.is-wrong::before{color:var(--bad);border-color:var(--bad)}
.hw-choice.is-wrong::after{content:"✗";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:700 24px/1 var(--font-py);color:var(--bad)}
.hw-choice.is-dim{opacity:.45}
.hw-choices.big{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.hw-choices.big .hw-choice{justify-content:center;text-align:center;min-height:78px;padding:12px 30px;font-family:var(--font-kai);font-size:32px;line-height:1.2}
.hw-choices.big .hw-choice::before{position:absolute;left:8px;top:8px;width:22px;height:22px;font-size:12px}
.hw-choices.big .hw-choice::after{right:8px;top:12px;transform:none;font-size:20px}

/* 田字格 */
.hw-tianzige{
  position:relative;display:grid;place-items:center;
  width:min(260px,100%);aspect-ratio:1/1;max-width:100%;
  font-family:var(--font-kai);line-height:1;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0 6px,transparent 6px 11px),
    repeating-linear-gradient(to bottom,var(--grid) 0 6px,transparent 6px 11px);
  background-size:100% 1px,1px 100%;
  background-position:0 50%,50% 0;
  background-repeat:no-repeat;
  border:2px solid var(--grid);
}
.hw-tianzige svg{display:block;position:relative}
.hw-tianzige.hw-hz{touch-action:none;place-items:start}

/* 排序块 */
.hw-tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;align-items:flex-start}
.hw-tile{
  display:inline-flex;align-items:center;min-height:48px;max-width:100%;padding:8px 14px;
  font-family:var(--font-kai);font-size:21px;line-height:1.35;overflow-wrap:anywhere;text-align:left;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--btn-edge);
  cursor:pointer;transition:transform .08s,opacity .15s,box-shadow .08s;
}
.hw-tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-tile.is-placed{opacity:.28;border-style:dashed;box-shadow:none;cursor:default}
.hw-slots{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;
  min-height:72px;padding:10px;
  background:var(--paper);border:2px dashed var(--line);border-radius:var(--radius);
}

/* 书写框：作文本横线 */
.hw-textarea{
  display:block;width:100%;min-height:10em;padding:0 14px;resize:vertical;
  font-family:var(--font-kai);font-size:20px;line-height:2em;
  color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent calc(2em - 1px),var(--rule) calc(2em - 1px));
  background-size:100% 2em;background-attachment:local;
  border:2px solid var(--line);border-radius:var(--radius);
}
.hw-textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent),0 0 0 1px var(--focus)}
.hw-textarea::placeholder{color:var(--ink-soft);opacity:.7}

/* 反馈：普通块级排版——子元素（标题 + 说明 + 按钮……）自上而下竖排，行内文字照常连排；
   .good/.bad 的 ✓/✗ 绝对定位在左上角、内容整体右移，不再和子元素挤成一排（手机上不会被压成两三列） */
.hw-feedback{
  display:block;position:relative;min-width:0;
  padding:12px 14px;border-radius:var(--radius);font-size:17px;line-height:1.6;
  background:var(--paper-2);border:2px dashed var(--line);overflow-wrap:anywhere;
}
.hw-feedback>*{min-width:0;max-width:100%}
.hw-feedback>*+*{margin-top:6px}
.hw-feedback.good,.hw-feedback.bad{padding-left:46px;color:var(--ink)}
.hw-feedback.good::before,.hw-feedback.bad::before{position:absolute;left:14px;top:12px;width:22px;text-align:center;font:700 22px/1.2 var(--font-py)}
.hw-feedback.good{background:var(--good-bg);border-color:var(--good)}
.hw-feedback.good::before{content:"✓";color:var(--good)}
.hw-feedback.bad{background:var(--bad-bg);border-color:var(--bad)}
.hw-feedback.bad::before{content:"✗";color:var(--bad)}

/* 进度条 */
.hw-meter{position:relative;height:14px;min-width:60px;background:var(--track);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.hw-meter>span{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s ease}

/* 看图说话的“图” */
.hw-scene{
  font-size:clamp(40px,11vw,64px);line-height:1.35;text-align:center;letter-spacing:.06em;
  padding:18px 12px;overflow-wrap:anywhere;
  background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:inset 0 0 0 6px var(--paper-2);
}

/* 逐字比对 */
.hw-hl-ok{color:var(--good);background:var(--good-bg);border-radius:3px}
.hw-hl-miss{color:var(--bad);background:var(--bad-bg);border-radius:3px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}

/* ============ 首页：作业本封面 ============ */
.hw-cover{
  position:relative;
  background:var(--cover);color:var(--cover-ink);
  border-radius:4px var(--radius) var(--radius) 4px;
  padding:16px 16px 18px 30px;
  box-shadow:var(--shadow);
  background-image:linear-gradient(90deg,var(--cover-2) 0 14px,transparent 14px);
}
.hw-cover::before,.hw-cover::after{ /* 订书钉 */
  content:"";position:absolute;left:5px;top:22%;width:4px;height:22px;border-radius:2px;
  background:var(--cover-ink);opacity:.5;
}
.hw-cover::after{top:auto;bottom:22%}
.hw-cover-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hw-title{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,7vw,40px);letter-spacing:.06em;line-height:1.1;margin-right:auto}
.hw-title small{display:block;font-family:var(--font-body);font-size:12px;letter-spacing:.2em;opacity:.75;margin-top:4px}
.hw-flowercount{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:var(--label-bg);color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--cover-2)}
.hw-flowercount b{font-size:20px}
.hw-cover .hw-icon-btn{background:var(--label-bg);color:var(--ink);border-color:var(--cover-2);box-shadow:0 3px 0 var(--cover-2)}
.hw-cover-top :focus-visible{outline-color:var(--cover-ink)} /* 墨绿封面上蓝色焦点环几乎看不见 */
.hw-label{
  margin-top:14px;background:var(--label-bg);color:var(--ink);
  border:2px solid var(--ink);border-radius:4px;
  display:grid;grid-template-columns:auto 1fr;max-width:560px;
}
.hw-label-k{padding:8px 12px;border-right:1.5px solid var(--ink);font-family:var(--font-kai);font-size:18px;white-space:nowrap;display:flex;align-items:center}
.hw-label-v{padding:6px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hw-label-k:not(:nth-last-child(-n+2)),.hw-label-v:not(:last-child){border-bottom:1.5px solid var(--ink)}
.hw-label-v .hw-kai{font-size:20px}
.hw-who{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:44px;max-width:100%;min-width:0;padding:4px 10px;background:none;border:0;border-bottom:2px dashed var(--line);cursor:pointer;font-family:var(--font-kai);font-size:22px;text-align:left;overflow-wrap:anywhere}
.hw-who small{font-family:var(--font-body);font-size:13px;color:var(--ink-soft)}
.hw-grades{display:flex;flex-wrap:wrap;gap:6px}
.hw-gradebtn{min-width:48px;min-height:44px;padding:4px 10px;font:700 16px/1 var(--font-py);background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:6px;cursor:pointer}
.hw-gradebtn[aria-checked="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep)}
.hw-gradenote{margin-top:10px;font-size:14px;opacity:.9}

/* 今日四件事 */
.hw-top2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.hw-today{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px 16px;box-shadow:var(--shadow)}
.hw-sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hw-sechead h2{font-family:var(--font-kai);font-size:22px;font-weight:700}
.hw-sechead .n{font:700 15px var(--font-py);color:var(--accent);font-variant-numeric:tabular-nums}
.hw-cells{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.hw-tcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.hw-tcell .hw-tianzige{width:clamp(56px,16vw,76px);font-size:clamp(36px,10vw,50px)}
.hw-tcell-l{font-size:13px;color:var(--ink-soft)}
.hw-tcell .hw-stamp{position:absolute;right:-8px;top:-8px}
.hw-todaynote{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.hw-dateseal{
  --s:78px;display:inline-grid;place-items:center;align-content:center;gap:0;flex:none;
  width:var(--s);height:var(--s);border-radius:50%;color:var(--accent);
  border:4px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);
  transform:rotate(-10deg);mix-blend-mode:var(--stamp-blend);font-family:var(--font-kai);margin-left:4px;
}
.hw-dateseal small{font-size:13px;line-height:1}
.hw-dateseal b{font:700 20px/1.1 var(--font-py)}

/* 书架：错题本/印章册/记录/档案 */
