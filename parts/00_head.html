  --paper:#FFFFFF;

  --paper-2:#EEF6FE;

/* ============ 页面底 ============ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg-top),var(--bg) 380px);
  background-repeat:no-repeat;
  color:var(--ink);
  font:16px/1.6 var(--font-body);
  min-height:100%;
  overflow-x:hidden;
}
#app{min-height:100%}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.hw-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important} /* .hw-btn 等带 display 的类会盖过 UA 的 [hidden]，游戏里 el.hidden=true 必须真的藏起来 */

.hw-shell{max-width:1100px;margin-inline:auto;padding-inline:16px;padding-block:12px 48px}

/* ============ 公共类（游戏模块可用） ============ */
.hw-stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.hw-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.hw-card{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.hw-muted{color:var(--ink-soft)}
.hw-center{text-align:center;align-items:center;justify-content:center}
.hw-kai{font-family:var(--font-kai)}
.hw-py{font-family:var(--font-py);letter-spacing:.02em;color:var(--ink-soft)}
.hw-big{font-family:var(--font-kai);font-size:clamp(44px,13vw,76px);line-height:1.15;font-weight:400}
.hw-q{font-size:20px;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.hw-passage{
  font-family:var(--font-kai);font-size:20px;line-height:2em;
  white-space:pre-line;overflow-wrap:anywhere;max-width:36em;
  padding:0 14px 0 22px;margin:0;
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 12px,rgba(227,64,43,.35) 12px 14px,transparent 14px),
    linear-gradient(to bottom,transparent calc(2em - 1px),var(--rule) calc(2em - 1px));
  background-size:100% 100%,100% 2em;background-attachment:local;
  border:2.5px solid var(--line);border-radius:var(--radius);
}
.hw-passage p{margin:0;text-indent:2em;white-space:normal}
.hw-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;line-height:1.6;border:2px solid currentColor;color:var(--ink-soft);white-space:nowrap;font-weight:700;background:var(--paper)}
.hw-tag.listen{color:var(--listen)}.hw-tag.speak{color:var(--speak)}.hw-tag.read{color:var(--read)}.hw-tag.write{color:var(--write)}
.hw-tag.accent{color:var(--accent)}

/* 按钮：厚实的 3D 游戏按钮（底部深色投影，按下下沉） */
.hw-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;min-width:50px;padding:10px 20px;
  font-family:var(--font-body);font-size:17px;font-weight:800;line-height:1.2;
  color:var(--ink);background:var(--paper);
  border:3px solid var(--btn-edge);border-radius:14px;
  box-shadow:0 5px 0 var(--btn-edge);
  cursor:pointer;text-decoration:none;user-select:none;
  transition:transform .08s ease,box-shadow .08s ease,filter .15s;
}
.hw-btn:hover{filter:brightness(1.05)}
.hw-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-btn.primary{background:linear-gradient(180deg,var(--cta-1),var(--cta-2));color:var(--on-cta);border-color:var(--btn-edge)}
.hw-btn.primary::after{content:"";position:absolute;left:10%;right:10%;top:4px;height:30%;border-radius:999px;background:rgba(255,255,255,.35);pointer-events:none}
.hw-btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.hw-btn.ghost:hover{color:var(--ink);filter:none}
.hw-btn.ghost:active{transform:none;box-shadow:none}
.hw-btn.big{min-height:62px;padding:14px 30px;font-size:21px;border-radius:18px}
.hw-btn:disabled,.hw-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--btn-edge);filter:none}

.hw-icon-btn{
  display:inline-grid;place-items:center;flex:none;
  width:56px;height:56px;border-radius:50%;padding:0;
  font-size:26px;line-height:1;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--btn-edge);box-shadow:0 5px 0 var(--btn-edge);
  cursor:pointer;position:relative;
  transition:transform .08s ease,box-shadow .08s ease;
}
.hw-icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-icon-btn:disabled{opacity:.45;cursor:not-allowed}
.hw-icon-btn.is-active,.hw-icon-btn[aria-pressed="true"]{background:var(--cta-1);color:var(--on-cta)}
.hw-icon-btn.is-active::after,.hw-icon-btn[aria-pressed="true"]::after{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:4px solid var(--accent);opacity:.5;animation:hw-ring 1.1s ease-out infinite;
}
.hw-icon-btn.sm{width:46px;height:46px;font-size:20px;box-shadow:0 4px 0 var(--btn-edge)}

/* 选择题：四色字母泡泡（像抢答游戏） */
.hw-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;counter-reset:hwc}
.hw-choice{
  position:relative;display:flex;align-items:center;gap:12px;
  min-height:58px;width:100%;padding:10px 44px 10px 12px;
  text-align:left;font-family:var(--font-body);font-size:18px;line-height:1.45;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--line);border-radius:16px;
  box-shadow:0 5px 0 var(--line-deep);cursor:pointer;overflow-wrap:anywhere;
  transition:border-color .15s,background-color .15s,transform .08s,box-shadow .08s,opacity .2s;
}
.hw-choice::before{
  counter-increment:hwc;content:counter(hwc,upper-alpha);
  flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  font:800 16px/1 var(--font-num);color:var(--paper);background:var(--listen);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.hw-choice:nth-child(4n+2)::before{background:var(--speak)}
.hw-choice:nth-child(4n+3)::before{background:var(--read)}
.hw-choice:nth-child(4n+4)::before{background:var(--write)}
.hw-choice:hover{border-color:var(--line-deep)}
.hw-choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line-deep)}
.hw-choices.is-locked .hw-choice{cursor:default}
.hw-choices.is-locked .hw-choice:active{transform:none}
.hw-choice.is-right{border-color:var(--good);background:var(--good-bg);box-shadow:0 5px 0 var(--good);animation:hw-pop .4s ease}
.hw-choice.is-right::before{background:var(--good)}
.hw-choice.is-right::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:800 26px/1 var(--font-num);color:var(--good)}
.hw-choice.is-wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 5px 0 var(--bad);animation:hw-shake .35s ease}
.hw-choice.is-wrong::before{background:var(--bad)}
.hw-choice.is-wrong::after{content:"✗";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:800 26px/1 var(--font-num);color:var(--bad)}
.hw-choice.is-dim{opacity:.45}
.hw-choices.big{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.hw-choices.big .hw-choice{justify-content:center;text-align:center;min-height:82px;padding:12px 30px;font-family:var(--font-kai);font-size:32px;line-height:1.2}
.hw-choices.big .hw-choice::before{position:absolute;left:8px;top:8px;width:24px;height:24px;font-size:13px}
.hw-choices.big .hw-choice::after{right:8px;top:12px;transform:none;font-size:22px}

/* 田字格 */
.hw-tianzige{
  position:relative;display:grid;place-items:center;
  width:min(260px,100%);aspect-ratio:1/1;max-width:100%;
  font-family:var(--font-kai);line-height:1;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0 6px,transparent 6px 11px),
    repeating-linear-gradient(to bottom,var(--grid) 0 6px,transparent 6px 11px);
  background-size:100% 1px,1px 100%;
  background-position:0 50%,50% 0;
  background-repeat:no-repeat;
  border:2px solid var(--grid);
}
.hw-tianzige svg{display:block;position:relative}
.hw-tianzige.hw-hz{touch-action:none;place-items:start}

/* 排序块 */
.hw-tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;align-items:flex-start}
.hw-tile{
  display:inline-flex;align-items:center;min-height:50px;max-width:100%;padding:8px 14px;
  font-family:var(--font-kai);font-size:21px;line-height:1.35;overflow-wrap:anywhere;text-align:left;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--btn-edge);border-radius:12px;box-shadow:0 4px 0 var(--btn-edge);
  cursor:pointer;transition:transform .08s,opacity .15s,box-shadow .08s;
}
.hw-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-tile.is-placed{opacity:.28;border-style:dashed;box-shadow:none;cursor:default}
.hw-slots{
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;
  min-height:72px;padding:10px;
  background:var(--paper-2);border:3px dashed var(--line-deep);border-radius:var(--radius);
}

/* 书写框：作文本横线 */
.hw-textarea{
  display:block;width:100%;min-height:10em;padding:0 14px;resize:vertical;
  font-family:var(--font-kai);font-size:20px;line-height:2em;
  color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent calc(2em - 1px),var(--rule) calc(2em - 1px));
  background-size:100% 2em;background-attachment:local;
  border:3px solid var(--line);border-radius:var(--radius);
}
.hw-textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focus)}
.hw-textarea::placeholder{color:var(--ink-soft);opacity:.7}

/* 反馈：块级排版，✓/✗ 绝对定位在左上角 */
.hw-feedback{
  display:block;position:relative;min-width:0;
  padding:12px 14px;border-radius:var(--radius);font-size:17px;line-height:1.6;
  background:var(--paper-2);border:2.5px dashed var(--line-deep);overflow-wrap:anywhere;
}
.hw-feedback>*{min-width:0;max-width:100%}
.hw-feedback>*+*{margin-top:6px}
.hw-feedback.good,.hw-feedback.bad{padding-left:48px;color:var(--ink);border-style:solid}
.hw-feedback.good::before,.hw-feedback.bad::before{position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--font-num);color:var(--paper)}
.hw-feedback.good{background:var(--good-bg);border-color:var(--good)}
.hw-feedback.good::before{content:"✓";background:var(--good)}
.hw-feedback.bad{background:var(--bad-bg);border-color:var(--bad)}
.hw-feedback.bad::before{content:"✗";background:var(--bad)}

/* 进度条：游戏血条式 */
.hw-meter{position:relative;height:18px;min-width:60px;background:var(--track);border:3px solid var(--btn-edge);border-radius:999px;overflow:hidden}
.hw-meter>span{display:block;height:100%;width:0;border-radius:999px;transition:width .35s ease;
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0 35%,transparent 35%),linear-gradient(180deg,var(--go-1),var(--go-2))}

/* 看图说话的“图” */
.hw-scene{
  font-size:clamp(40px,11vw,64px);line-height:1.35;text-align:center;letter-spacing:.06em;
  padding:18px 12px;overflow-wrap:anywhere;
  background:linear-gradient(180deg,var(--paper-2),var(--paper));border:3px solid var(--line);border-radius:var(--radius);
}

/* 逐字比对 */
.hw-hl-ok{color:var(--good);background:var(--good-bg);border-radius:3px}
.hw-hl-miss{color:var(--bad);background:var(--bad-bg);border-radius:3px;text-decoration:underline wavy var(--bad);text-underline-offset:4px}

/* ============ 首页：会动的游戏岛地图 ============ */
.hw-world{
  position:relative;overflow-x:clip;min-height:100vh;
  padding-bottom:calc(128px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--sea-1) 0,var(--sea-2) 40%,var(--sea-3) 100%);
}
.hw-world::before{ /* 海面上一道道会动的小浪花 */
  content:"";position:absolute;top:0;bottom:0;left:-120px;right:-120px;pointer-events:none;
  background-image:
    radial-gradient(24px 10px at 50% 100%,transparent 70%,var(--wave) 74% 92%,transparent 96%),
    radial-gradient(18px 8px at 50% 100%,transparent 70%,var(--wave) 74% 92%,transparent 96%);
  background-size:120px 64px,120px 64px;background-position:0 0,60px 32px;
  animation:hw-slide120 9s linear infinite;
}
.hw-world>*{position:relative}

/* 顶部 HUD */
.hw-hud{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:7px max(10px,env(safe-area-inset-right)) 7px max(10px,env(safe-area-inset-left));
  background:var(--hud);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:3px solid var(--btn-edge);
}
.hw-me{display:flex;align-items:center;gap:8px;min-height:48px;min-width:0;padding:0 8px 0 0;margin-right:auto;background:none;border:0;cursor:pointer;color:var(--ink);text-align:left;border-radius:999px}
.hw-me-av{
  flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;
  font-size:28px;line-height:1;background:#fff;border:3px solid var(--btn-edge);box-shadow:0 3px 0 var(--btn-edge),inset 0 0 0 3px var(--cta-2);
  animation:hw-nod 2.6s ease-in-out infinite;
}
.hw-me-nm{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.hw-me-nm b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:6.5em}
.hw-me-nm small{font-size:12px;color:var(--ink-soft)}
.hw-pill{
  flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:2px 12px 2px 4px;border-radius:999px;
  background:var(--paper);color:var(--ink);border:3px solid var(--btn-edge);box-shadow:0 3px 0 var(--btn-edge);
  font:800 19px/1 var(--font-num);font-variant-numeric:tabular-nums;cursor:default;
}
button.hw-pill{cursor:pointer}
button.hw-pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-pill b{font-weight:800;padding-top:2px}
.hw-coin{
  position:relative;overflow:hidden;flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF4B0,#FFC928 55%,#D98E00);border:2.5px solid var(--btn-edge);
}
.hw-coin::after{content:"";position:absolute;inset:-4px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 48%,transparent 60%);transform:translateX(-120%);animation:hw-shine 3.4s ease-in-out infinite}
.hw-coin .hw-flower .p{fill:#E8452F}.hw-coin .hw-flower .c{fill:#FFE36E}
.hw-pill .hw-stamp{margin:0 2px 0 4px;background:var(--paper)}
.hw-hudbtn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;background:var(--paper);border:3px solid var(--btn-edge);box-shadow:0 3px 0 var(--btn-edge);cursor:pointer;padding:0}
.hw-hudbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}

/* 天空 + 标题 */
.hw-hero{
  position:relative;z-index:1;overflow:hidden;text-align:center;
  padding:30px 14px 96px;
  background:linear-gradient(180deg,var(--sky-1) 0,var(--sky-2) 58%,var(--sky-3) 100%);
}
.hw-sky{position:absolute;inset:0;pointer-events:none}
.hw-sun{position:absolute;top:12px;right:5%;width:56px;height:56px;border-radius:50%;opacity:var(--sun-on);
  background:radial-gradient(circle at 40% 38%,#FFF6BC,var(--sun) 58%,#FFB000);box-shadow:0 0 0 10px rgba(255,236,140,.35),0 0 44px 14px rgba(255,220,100,.55)}
.hw-sun::before{content:"";position:absolute;inset:-34px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,240,150,.55) 0 8deg,transparent 8deg 22.5deg);
  -webkit-mask:radial-gradient(circle,transparent 40%,#000 42%,transparent 72%);mask:radial-gradient(circle,transparent 40%,#000 42%,transparent 72%);
  animation:hw-spin 24s linear infinite}
.hw-moon{position:absolute;top:18px;right:9%;width:54px;height:54px;border-radius:50%;opacity:var(--moon-on);
  box-shadow:inset -14px 5px 0 0 var(--sun);filter:drop-shadow(0 0 14px rgba(255,241,184,.7));transform:rotate(-18deg)}
.hw-starfield{position:absolute;inset:0;opacity:var(--stars-on);
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 28% 42%,#fff 98%,transparent),
    radial-gradient(2px 2px at 44% 12%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 58% 34%,#fff 98%,transparent),
    radial-gradient(1.8px 1.8px at 70% 58%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 84% 40%,#fff 98%,transparent),
    radial-gradient(1.6px 1.6px at 6% 62%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 36% 70%,#fff 98%,transparent),
    radial-gradient(1.6px 1.6px at 92% 72%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 20% 8%,#fff 98%,transparent)}
.hw-twinkle{position:absolute;width:14px;height:14px;opacity:var(--stars-on);
  background:linear-gradient(90deg,transparent 42%,#fff 42% 58%,transparent 58%),linear-gradient(0deg,transparent 42%,#fff 42% 58%,transparent 58%);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);
  animation:hw-twinkle 2.4s ease-in-out infinite}
.hw-cloud{position:absolute;left:-150px;width:120px;height:38px;border-radius:40px;background:var(--cloud);opacity:.95;
  box-shadow:inset 0 -6px 0 rgba(29,43,79,.08);
  animation:hw-drift var(--dur,60s) linear infinite;animation-delay:calc(var(--t,0s) + var(--d,0s))}
.hw-cloud::before,.hw-cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.hw-cloud::before{width:54px;height:54px;left:18px;top:-26px}
.hw-cloud::after{width:40px;height:40px;left:60px;top:-16px}
.hw-gull{position:absolute;left:-60px;width:38px;height:22px;animation:hw-drift var(--dur,26s) linear infinite;animation-delay:calc(var(--t,0s) + var(--d,0s))}
.hw-gull svg{width:100%;height:100%;overflow:visible;animation:hw-flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
.hw-gull path{fill:none;stroke:var(--btn-edge);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hw-lanterns{position:absolute;left:0;right:0;top:0;height:70px}
.hw-lanterns::before{content:"";position:absolute;left:-5%;right:-5%;top:-58px;height:90px;border-bottom:2px solid rgba(29,43,79,.45);border-radius:0 0 50% 50%}
.hw-lan{position:absolute;top:var(--y,20px);left:var(--x,20%);width:26px;height:22px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FFB39A,var(--lantern) 58%,#9E1F14);border:2px solid var(--btn-edge);
  box-shadow:0 0 20px 8px var(--lantern-glow);transform-origin:50% -12px;animation:hw-swing 3s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.hw-lan::before{content:"";position:absolute;left:5px;right:5px;top:-6px;height:5px;background:#F2C12E;border:1.5px solid var(--btn-edge);border-radius:2px}
.hw-lan::after{content:"";position:absolute;left:50%;bottom:-11px;width:3px;height:9px;margin-left:-1.5px;background:#F2C12E;border-radius:2px}

.hw-logo{position:relative;display:inline-flex;gap:.02em;margin:22px 0 0;font-family:var(--font-display);font-weight:400;font-size:clamp(50px,15vw,84px);line-height:1;letter-spacing:.02em}
.hw-logo span{display:inline-block;color:var(--c);
  text-shadow:
    3px 0 0 var(--btn-edge),-3px 0 0 var(--btn-edge),0 3px 0 var(--btn-edge),0 -3px 0 var(--btn-edge),
    2px 2px 0 var(--btn-edge),-2px 2px 0 var(--btn-edge),2px -2px 0 var(--btn-edge),-2px -2px 0 var(--btn-edge),
    0 8px 0 var(--btn-edge),0 14px 18px rgba(0,0,0,.25);
  animation:hw-letter 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * .18s)}
.hw-logo span:nth-child(1){--c:#FF6B5A}.hw-logo span:nth-child(2){--c:#FFD23F}.hw-logo span:nth-child(3){--c:#7BE36A}.hw-logo span:nth-child(4){--c:#6CC6FF}
.hw-tagline{position:relative;display:inline-block;margin-top:14px;padding:4px 22px;font:400 18px/1.5 var(--font-display);letter-spacing:.12em;
  color:var(--on-cta);background:linear-gradient(180deg,var(--cta-1),var(--cta-2));border:3px solid var(--btn-edge);border-radius:10px;box-shadow:0 4px 0 var(--btn-edge);transform:rotate(-2deg)}
.hw-hero-row{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.hw-grades{position:relative;z-index:1;display:inline-flex;gap:6px;padding:6px;border-radius:999px;background:var(--hud);border:3px solid var(--btn-edge);box-shadow:0 4px 0 var(--btn-edge)}
.hw-gradebtn{min-width:52px;min-height:44px;padding:4px 8px;border-radius:999px;border:0;background:transparent;color:var(--ink);font:800 18px/1 var(--font-num);cursor:pointer}
.hw-gradebtn[aria-checked="true"]{background:linear-gradient(180deg,var(--cta-1),var(--cta-2));color:var(--on-cta);box-shadow:inset 0 0 0 3px var(--btn-edge),0 3px 0 var(--btn-edge);transform:translateY(-2px)}
.hw-gradenote{position:relative;z-index:1;font-size:14px;font-weight:700;color:var(--ink);background:var(--hud);padding:2px 12px;border-radius:999px;border:2px solid rgba(29,43,79,.25)}
.hw-skyline{position:absolute;left:50%;bottom:24px;width:min(720px,118%);transform:translateX(-50%);height:auto;pointer-events:none}
.hw-skyline svg{display:block;width:100%;height:auto}
.hw-shore{position:absolute;left:-60px;right:-60px;bottom:0;height:36px;pointer-events:none;animation:hw-slide60 4s linear infinite}
.hw-shore::before,.hw-shore::after{content:"";position:absolute;left:0;right:0;bottom:0}
.hw-shore::before{height:36px;background:radial-gradient(circle at 30px 2px,transparent 22px,rgba(255,255,255,.75) 23px) 0 0/60px 36px repeat-x}
.hw-shore::after{height:30px;background:radial-gradient(circle at 30px 0,transparent 20px,var(--sea-1) 21px) 30px 0/60px 30px repeat-x}

/* 今日四件事：木头任务板 */
.hw-quest{
  z-index:3;width:min(620px,calc(100% - 24px));margin:-54px auto 0;padding:34px 12px 12px;
  color:#FFF8EA;border:3px solid var(--btn-edge);border-radius:20px;
  background:
    repeating-linear-gradient(180deg,transparent 0 30px,rgba(0,0,0,.14) 30px 33px),
    linear-gradient(180deg,var(--wood-1),var(--wood-2));
  box-shadow:0 7px 0 var(--wood-3),0 7px 0 3px var(--btn-edge),0 24px 34px -16px rgba(0,0,0,.55);
}
.hw-quest::before,.hw-quest::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:#FFE7B8;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.hw-quest::before{left:12px}.hw-quest::after{right:12px}
.hw-quest-plate{position:absolute;left:50%;top:-22px;transform:translateX(-50%) rotate(-1.5deg);display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:4px 18px;background:#FFF3D6;color:#5A3510;border:3px solid var(--btn-edge);border-radius:12px;box-shadow:0 4px 0 var(--btn-edge)}
.hw-quest-plate h2{font:400 21px/1.3 var(--font-display);letter-spacing:.06em;white-space:nowrap;text-wrap:nowrap}
.hw-quest-plate .n{font:800 18px/1 var(--font-num);color:#C2410C}
.hw-quest-row{display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,2.4vw,16px)}
.hw-qslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:0;background:none;border:0;color:#FFF8EA;cursor:pointer}
.hw-qslot-ch{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font:400 32px/1 var(--font-kai);font-weight:700;
  color:var(--c2);background:radial-gradient(circle at 50% 40%,#FFFDF6,#FBE8C4);border:3px solid var(--btn-edge);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 4px 0 var(--btn-edge)}
.hw-qslot:active .hw-qslot-ch{transform:translateY(3px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 1px 0 var(--btn-edge)}
.hw-qslot-l{font-size:13px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hw-qslot.is-done .hw-qslot-ch{color:#fff;background:radial-gradient(circle at 40% 30%,var(--c1),var(--c2) 70%,var(--c3))}
.hw-qslot .hw-stamp{position:absolute;right:-12px;top:-10px;background:#FFF8EA;border-radius:50%}
.hw-qslot[data-s="listen"]{--c1:#9AD8FF;--c2:#1C7FE0;--c3:#0F4F9A}
.hw-qslot[data-s="speak"]{--c1:#FFCB8A;--c2:#EF7A1A;--c3:#A94206}
.hw-qslot[data-s="read"]{--c1:#96F2CF;--c2:#12A883;--c3:#0A6B53}
.hw-qslot[data-s="write"]{--c1:#E6BDFF;--c2:#9A55E6;--c3:#5E2AA6}
.hw-chest{display:grid;place-items:center;width:64px;height:58px;font-size:40px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.hw-chest.is-near{animation:hw-wiggle 1.2s ease-in-out infinite}
.hw-chest .hw-dateseal{--s:58px;margin:0;background:#FFF8EA}
.hw-quest-bar{height:14px;margin:12px 6px 0;border-radius:999px;background:rgba(0,0,0,.28);border:2.5px solid var(--btn-edge);overflow:hidden}
.hw-quest-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5) 0 35%,transparent 35%),linear-gradient(180deg,#FFE36E,#FFB41A);transition:width .5s}
.hw-todaynote{margin-top:8px;font-size:14px;font-weight:600;text-align:center;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.hw-hint{width:min(620px,calc(100% - 24px));margin:18px auto 0;padding:10px 14px;font-size:14px;font-weight:600;border:3px solid var(--btn-edge);border-radius:16px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--btn-edge)}

/* 四座岛 */
.hw-sea{padding:34px 12px 8px}
.hw-isles{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:30px 28px;max-width:1180px;margin:0 auto}
.hw-isles::before{content:"";position:absolute;left:50%;top:30px;bottom:60px;border-left:6px dashed rgba(255,255,255,.4);transform:translateX(-50%)}
.hw-isle{position:relative;min-width:0;scroll-margin-top:72px}
.hw-isle-listen{--c1:#9AD8FF;--c2:#2E97F0;--c3:#1257A8}
.hw-isle-speak{--c1:#FFCB8A;--c2:#FF8A2A;--c3:#B94A06}
.hw-isle-read{--c1:#96F2CF;--c2:#1FBF95;--c3:#0A7359}
.hw-isle-write{--c1:#E6BDFF;--c2:#A864F0;--c3:#6A2FB5}
.hw-isle-head{position:relative;z-index:3;display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;margin:0 auto;padding:4px 16px 4px 4px;
  border-radius:999px;background:linear-gradient(180deg,var(--c2),var(--c3));border:3px solid var(--btn-edge);box-shadow:0 5px 0 var(--btn-edge);color:#fff}
.hw-isle-ch{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#FFFDF6;color:var(--c3);border:3px solid var(--btn-edge);font:700 30px/1 var(--font-kai)}
.hw-isle-t{min-width:0}
.hw-isle-t h2{font:400 23px/1.15 var(--font-display);letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hw-isle-t p{font-size:12px;font-weight:700;opacity:.95;line-height:1.3}
.hw-zonestat{margin-left:6px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.22);font:700 12px/1.6 var(--font-body);white-space:nowrap;font-variant-numeric:tabular-nums}
.hw-land{position:relative;padding:112px 4px 40px;min-height:300px}
.hw-ground{position:absolute;left:3%;right:3%;top:78px;bottom:16px;border-radius:46% 54% 50% 50% / 44% 42% 58% 56%;
  background:
    radial-gradient(8px 5px at 18% 38%,rgba(255,255,255,.35) 60%,transparent 70%),
    radial-gradient(10px 6px at 72% 30%,rgba(255,255,255,.3) 60%,transparent 70%),
    radial-gradient(8px 5px at 60% 78%,rgba(255,255,255,.3) 60%,transparent 70%),
    radial-gradient(120% 90% at 45% 28%,var(--grass-1),var(--grass-2) 55%,var(--grass-3));
  box-shadow:0 0 0 13px var(--sand),inset 0 -10px 0 rgba(0,0,0,.08),0 13px 0 13px var(--sand-2),0 24px 0 13px var(--cliff),0 34px 26px 14px rgba(0,30,70,.3)}
.hw-ground::after{content:"";position:absolute;inset:-30px -30px -44px;border-radius:inherit;border:4px solid rgba(255,255,255,.55);animation:hw-foam 3.4s ease-in-out infinite}
.hw-art{display:block;pointer-events:none}
.hw-art svg{display:block;width:100%;height:100%;overflow:visible}
.hw-mark{position:absolute;z-index:1;top:0;left:3%;width:118px;height:142px}
.hw-palm{position:absolute;z-index:1;top:34px;right:4%;width:74px;height:104px}
.hw-palm-2{top:64px;right:auto;left:40%;width:50px;height:70px;opacity:.95}
.hw-isle-speak .hw-mark{width:128px}
.hw-isle-write .hw-mark{width:136px}
.hw-lvs{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:4px 8px}
.hw-lvs>.hw-lv:nth-child(odd){margin-top:36px}
.hw-lvs>.hw-lv:only-child{margin-top:0}
.hw-land-empty{position:relative;z-index:2;margin:30px auto 0;width:fit-content;padding:6px 14px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:700;border:3px solid var(--btn-edge)}

/* 关卡按钮：大圆形 3D */
.hw-lv{position:relative;display:flex;flex-direction:column;align-items:center;width:clamp(98px,29vw,126px);padding:20px 0 0;background:none;border:0;cursor:pointer;color:var(--ink);-webkit-tap-highlight-color:transparent}
.hw-lv:focus-visible{outline:none}
.hw-lv:focus-visible .hw-lv-orb{outline:4px solid var(--focus);outline-offset:6px}
.hw-lv-orb{position:relative;display:grid;place-items:center;width:clamp(80px,22vw,98px);aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 9%,var(--c1) 24%,var(--c2) 62%,var(--c3) 100%);
  border:4px solid var(--btn-edge);
  box-shadow:0 8px 0 var(--btn-edge),inset 0 -9px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35);
  transition:transform .1s ease,box-shadow .1s ease}
.hw-lv:hover .hw-lv-orb{transform:translateY(-3px) scale(1.03)}
.hw-lv:active .hw-lv-orb{transform:translateY(6px);box-shadow:0 2px 0 var(--btn-edge),inset 0 -9px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35)}
.hw-lv-ic{font-size:clamp(38px,11vw,48px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28));animation:hw-bob 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.hw-lv-stars{position:absolute;top:0;left:50%;z-index:2;display:flex;align-items:flex-end;transform:translateX(-50%)}
.hw-lv-stars svg{width:25px;height:25px;overflow:visible}
.hw-lv-stars svg:nth-child(1){transform:translateY(6px) rotate(-20deg)}
.hw-lv-stars svg:nth-child(2){width:30px;height:30px;margin:0 -1px}
.hw-lv-stars svg:nth-child(3){transform:translateY(6px) rotate(20deg)}
.hw-lv-stars path{fill:rgba(255,255,255,.75);stroke:var(--btn-edge);stroke-width:2.2;stroke-linejoin:round}
.hw-lv-stars .on path{fill:#FFD23F}
.hw-lv-lv{position:relative;z-index:1;margin-top:-13px;padding:1px 10px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,var(--cta-1),var(--cta-2));color:var(--on-cta);border:3px solid var(--btn-edge);
  font:800 15px/1.35 var(--font-num)}
.hw-lv-nm{margin-top:6px;padding:2px 9px;max-width:calc(100% + 10px);border-radius:10px;background:var(--paper);color:var(--ink);
  font:400 16px/1.3 var(--font-display);letter-spacing:.02em;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.22);text-wrap:balance}
.hw-lv-new{position:absolute;top:24px;right:-2px;z-index:3;padding:0 7px;border-radius:999px;background:#E3402B;color:#fff;border:2.5px solid var(--btn-edge);
  font:800 13px/1.5 var(--font-body);transform:rotate(14deg);animation:hw-wiggle 1.8s ease-in-out infinite}
.hw-lv-wn{position:absolute;top:26px;left:2px;z-index:3;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#fff;color:#C2261B;border:2.5px solid var(--btn-edge);font:800 13px/19px var(--font-num);text-align:center}
.hw-lv.is-off{cursor:not-allowed}
.hw-lv.is-off .hw-lv-orb{--c1:#EEF1F6;--c2:#B9C3D4;--c3:#7F8BA3;filter:saturate(.4)}
.hw-lv.is-off .hw-lv-ic{animation:none;font-size:34px}
.hw-lv.is-off .hw-lv-lv{background:#D9DFE9;color:#3A465F;font:700 12px/1.6 var(--font-body)}
.hw-lv.is-next .hw-lv-orb::after{content:"";position:absolute;inset:-13px;border-radius:50%;border:5px solid #FFE36E;animation:hw-pulse 1.5s ease-out infinite}
.hw-pin{position:absolute;z-index:4;top:-40px;left:50%;width:54px;height:54px;margin-left:-27px;display:grid;place-items:center;
  border-radius:50%;font-size:32px;line-height:1;background:#fff;border:4px solid var(--btn-edge);box-shadow:inset 0 0 0 3px #FFB41A;
  animation:hw-hop 1.1s ease-in-out infinite;transform-origin:50% 100%}
.hw-pin::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-8px;border:8px solid transparent;border-top:10px solid var(--btn-edge);border-bottom:0}
.hw-lv.is-next{padding-top:20px}

/* 练习本（1.0 的练习游戏收在这里） */
.hw-pbook{position:relative;z-index:3;margin:4px 6px 0;border-radius:18px;background:var(--paper);border:3px solid var(--btn-edge);box-shadow:0 5px 0 var(--btn-edge)}
.hw-pbook>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 16px 6px 10px;cursor:pointer;border-radius:15px;color:var(--ink)}
.hw-pbook>summary::-webkit-details-marker{display:none}
.hw-pbook>summary::after{content:"";flex:none;margin-left:auto;width:12px;height:12px;border-right:3.5px solid currentColor;border-bottom:3.5px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s}
.hw-pbook[open]>summary::after{transform:translateY(3px) rotate(-135deg)}
.hw-pbook-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;font-size:22px;background:var(--paper-2);border:2.5px solid var(--line-deep)}
.hw-pbook-t{font:400 20px/1.2 var(--font-display);letter-spacing:.06em}
.hw-pbook summary small{font-size:13px;color:var(--ink-soft);font-weight:700}
.hw-pbook-body{padding:6px 12px 14px 22px;border-top:2.5px dashed var(--line);
  background-image:linear-gradient(90deg,transparent 10px,rgba(227,64,43,.35) 10px 12px,transparent 12px);border-radius:0 0 15px 15px}
.hw-gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.hw-gcard{
  display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;row-gap:2px;align-content:center;align-items:center;
  width:100%;min-height:82px;padding:10px 12px;text-align:left;cursor:pointer;
  background:var(--paper);color:var(--ink);
  border:2.5px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line-deep);
  transition:transform .1s ease,border-color .12s,box-shadow .1s;
}
.hw-gcard:hover{border-color:var(--zc);transform:translateY(-2px)}
.hw-gcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-deep)}
.hw-gcard-ic{grid-row:1 / span 3;align-self:center;display:grid;place-items:center;width:52px;height:52px;font-size:28px;border-radius:12px;
  border:2.5px solid var(--zc);background:var(--paper-2);background:color-mix(in srgb,var(--zc) 16%,var(--paper))}
.hw-gcard-n{font-family:var(--font-kai);font-size:20px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hw-gcard-b{font-size:14px;color:var(--ink-soft);line-height:1.4}
.hw-gcard-m{grid-column:2;font-size:12px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums}
.hw-gcard-m .new{color:var(--accent);font-weight:800}
.hw-gcard[aria-disabled="true"]{cursor:not-allowed;opacity:.55;transform:none;box-shadow:none;border-style:dashed}
.hw-mini-stars{color:var(--gold);letter-spacing:1px}

/* 海上的小船、跳鱼、闪光 */
.hw-boat{position:absolute;z-index:0;left:-110px;width:92px;height:72px;pointer-events:none;animation:hw-drift var(--dur,40s) linear infinite;animation-delay:calc(var(--t,0s) + var(--d,0s))}
.hw-boat .hw-art{width:100%;height:100%;animation:hw-rock 2.4s ease-in-out infinite}
.hw-boat.rev{animation-name:hw-drift-rev;left:auto;right:-110px}
.hw-boat.rev .hw-art{transform:scaleX(-1);animation-name:hw-rock-rev}
.hw-fish{position:absolute;z-index:0;width:44px;height:30px;pointer-events:none}
.hw-fish .hw-art{width:100%;height:100%;opacity:0;animation:hw-jump 5.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.hw-fish::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-4px;height:10px;border-radius:50%;border:3px solid rgba(255,255,255,.8);opacity:0;animation:hw-splash 5.5s ease-out infinite;animation-delay:var(--d,0s)}
.hw-spk{position:absolute;z-index:0;width:16px;height:16px;pointer-events:none;
  background:linear-gradient(90deg,transparent 44%,#fff 44% 56%,transparent 56%),linear-gradient(0deg,transparent 44%,#fff 44% 56%,transparent 56%);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);
  animation:hw-twinkle 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.hw-foot{margin:26px auto 0;padding:0 16px;font-size:12px;font-weight:600;color:rgba(255,255,255,.9);text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.35)}

/* 底部 dock：错题本/印章册/学习记录/档案 */
.hw-dock{position:fixed;z-index:25;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:min(540px,calc(100% - 20px));padding:6px;border-radius:24px;
  background:var(--hud);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:3px solid var(--btn-edge);box-shadow:0 6px 0 var(--btn-edge),0 20px 30px -12px rgba(0,0,0,.45)}
.hw-dockbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px;padding:5px 2px 3px;border:0;border-radius:18px;background:transparent;color:var(--ink);cursor:pointer;font:800 13px/1.2 var(--font-body)}
.hw-dockbtn:hover{background:var(--paper-2)}
.hw-dockbtn .ic{display:grid;place-items:center;width:46px;height:42px;border-radius:13px;border:3px solid var(--btn-edge);box-shadow:0 4px 0 var(--btn-edge);background:var(--c);transition:transform .08s,box-shadow .08s;line-height:1}
.hw-dockbtn:active .ic{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-dockbtn .ic-wrong{--c:#FF6B5A;color:#fff;font:700 24px/1 var(--font-kai);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.hw-dockbtn .ic-seal{--c:#FFF6E4}
.hw-dockbtn .ic-chart{--c:#4FC3F7;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:7px}
.hw-dockbtn .ic-chart i{display:block;width:7px;border-radius:2px;background:#fff;border:1.5px solid var(--btn-edge)}
.hw-dockbtn .ic-chart i:nth-child(1){height:10px}.hw-dockbtn .ic-chart i:nth-child(2){height:18px}.hw-dockbtn .ic-chart i:nth-child(3){height:24px}
.hw-dockbtn .ic-me{--c:#FFD166;font-size:26px}
.hw-dockbtn .badge{position:absolute;top:0;right:calc(50% - 36px);min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#E3402B;color:#fff;border:2.5px solid var(--btn-edge);font:800 13px/19px var(--font-num);text-align:center}

/* 岛上的画（SVG，颜色全走 token，夜晚自动换色） */
.hw-art svg *{stroke:var(--btn-edge);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.hw-art .nk{stroke:none}
.hw-art .k-line{fill:none}
.k-rock{fill:var(--rock)}.k-tower{fill:var(--tower)}.k-stripe{fill:var(--stripe)}.k-glass{fill:var(--glass)}.k-roof{fill:var(--roof)}.k-edge{fill:var(--btn-edge)}.k-beam{fill:var(--beam)}.k-door{fill:var(--wood-2)}
.k-curtain{fill:var(--curtain)}.k-curtain2{fill:var(--curtain-2)}.k-backdrop{fill:var(--backdrop)}.k-spot{fill:var(--spot)}.k-wood{fill:var(--wood-1)}.k-wood2{fill:var(--wood-2)}.k-mic{fill:#9AA8BA}
.k-trunk{fill:var(--trunk)}.k-leaf1{fill:var(--leaf-1)}.k-leaf2{fill:var(--leaf-2)}.k-b1{fill:var(--book-1)}.k-b2{fill:var(--book-2)}.k-b3{fill:var(--book-3)}.k-page{fill:var(--pagec)}.k-coco{fill:#7A4A22}
.k-m1{fill:var(--mount-1)}.k-m2{fill:var(--mount-2)}.k-snow{fill:var(--snow)}.k-bamboo{fill:var(--bamboo)}.k-bristle{fill:var(--bristle)}.k-seal{fill:#D6341F}.k-cloud{fill:var(--cloud)}
.hw-art .k-sealt{fill:#fff;stroke:none;font:700 15px var(--font-kai)}
.hw-art .k-note{fill:#FFE36E;stroke-width:1.2;font:800 24px var(--font-num)}
.k-hull{fill:var(--hull)}.k-sail{fill:var(--sail)}.k-sail2{fill:var(--sail-2)}.k-flag{fill:#FFD23F}
.k-fish{fill:#FF8A2A}.k-fin{fill:#FFC04A}.hw-art .k-eye{fill:#1D2B4F;stroke:none}
.hw-skyline svg *{stroke:none}
.hw-skyline .k-sil{fill:var(--sil)}.hw-skyline .k-sil2{fill:var(--sil-2)}
.hw-skyline .k-win{fill:none;stroke:var(--win);stroke-width:2.2;stroke-dasharray:3 4;stroke-linecap:butt}
.hw-skyline .k-silring{fill:none;stroke:var(--sil);stroke-width:3}
.hw-art .a-beam{transform-origin:60px 34px;animation:hw-beam 5s ease-in-out infinite}
.hw-art .a-spotL{transform-origin:40px 46px;animation:hw-spot 3.2s ease-in-out infinite}
.hw-art .a-spotR{transform-origin:90px 46px;animation:hw-spot 3.2s ease-in-out infinite reverse}
.hw-art .a-note{animation:hw-note 2.8s ease-out infinite}
.hw-art .a-note.n2{animation-delay:1.4s}
.hw-art .a-sway{transform-origin:51px 35px;animation:hw-sway 3.6s ease-in-out infinite}
.hw-palm-2 .a-sway{animation-delay:-1.2s}
.hw-art .a-page{animation:hw-page 4.6s ease-in infinite}
.hw-art .a-cloud{animation:hw-cloudbob 5s ease-in-out infinite}
.hw-art .a-wheel{transform-origin:170px 44px;animation:hw-spin 40s linear infinite}

/* ============ 练习游戏容器 ============ */
.hw-playbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:10px;
  margin-inline:-16px;padding:8px 16px;
  background:var(--hud);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:4px solid var(--zc,var(--line));border-radius:0 0 18px 18px;
}
.hw-exit{min-height:44px;padding:6px 12px;font-size:15px;flex:none}
.hw-btn.ghost.hw-exit{color:var(--ink);text-decoration:none;background:var(--paper);border:3px solid var(--btn-edge);box-shadow:0 4px 0 var(--btn-edge);border-radius:12px}
.hw-btn.ghost.hw-exit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.hw-exit.is-armed,.hw-btn.ghost.hw-exit.is-armed{color:#fff;background:#D63A28}
.hw-playname{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--font-display);font-size:20px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.hw-playname .hw-tag{font-family:var(--font-body)}
.hw-playmeter{flex:1 1 60px}
.hw-playcount{font:800 17px var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.hw-combo{position:absolute;right:16px;top:100%;margin-top:8px;padding:2px 12px;border-radius:999px;
  background:linear-gradient(180deg,#FFB02E,#FF5A1F);color:#fff;border:2.5px solid var(--btn-edge);font:800 15px/1.6 var(--font-body);
  text-shadow:0 1px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.hw-combo::before{content:"🔥 "}
.hw-combo.is-on{opacity:1;transform:none}
.hw-combo.is-pop{animation:hw-pop .45s ease}
.hw-playbody{max-width:780px;margin-inline:auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hw-error{text-align:center}

/* ============ 街机游戏：精简顶栏 + 满高游戏区 ============ */
:root{--hw-arcbar-h:52px}
html[data-hw-view="arcade"] body{overscroll-behavior:none;background:var(--arcbar)}
@media (min-height:532px){html[data-hw-view="arcade"] body{overflow:hidden}}
.hw-arcshell{display:flex;flex-direction:column;min-height:100vh}
.hw-arcbar{
  position:relative;z-index:6;flex:none;height:var(--hw-arcbar-h);
  display:flex;align-items:center;gap:10px;
  padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  background:var(--arcbar);color:#fff;border-bottom:3px solid var(--zc2,#2E97F0);
}
.hw-arcbar .hw-btn.ghost.hw-exit{min-height:40px;padding:4px 14px;border-radius:999px;background:#fff;color:#13203F;border:2.5px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.45);font-weight:800;text-decoration:none}
.hw-arcbar .hw-btn.ghost.hw-exit:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.hw-arcbar .hw-btn.ghost.hw-exit.is-armed{background:#D63A28;color:#fff}
.hw-arcbar :focus-visible{outline-color:#FFD35C}
.hw-arcname{display:flex;align-items:center;gap:8px;min-width:0;font:400 20px/1 var(--font-display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-arcname .hw-tag{font-family:var(--font-body);background:transparent;color:#FFD35C;border-color:#FFD35C}
.hw-arcbar[data-s="listen"]{--zc2:#2E97F0}.hw-arcbar[data-s="speak"]{--zc2:#FF8A2A}.hw-arcbar[data-s="read"]{--zc2:#1FBF95}.hw-arcbar[data-s="write"]{--zc2:#A864F0}
.hw-arcbody{
  position:relative;flex:1 0 auto;width:100%;
  height:calc(100vh - var(--hw-arcbar-h));height:calc(100dvh - var(--hw-arcbar-h));min-height:480px;
  overflow:hidden;background:#0B1530;color:#fff;
}
.hw-arcbody>.hw-card{margin:16px;color:var(--ink)}

/* ============ 结算页：游戏化 ============ */
.hw-resview{position:relative;overflow:hidden;min-height:100vh;padding:56px 12px 48px;
  background:radial-gradient(circle at 50% 34%,var(--sky-3),var(--sky-2) 42%,var(--sky-1) 100%)}
.hw-resview::before{content:"";position:absolute;left:50%;top:300px;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.2) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);
  animation:hw-spin 50s linear infinite}
.hw-result{position:relative;max-width:560px;margin:0 auto;padding:50px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:var(--paper);border:4px solid var(--btn-edge);border-radius:30px;box-shadow:0 9px 0 var(--btn-edge),0 34px 50px -20px rgba(0,0,0,.55);
  animation:hw-panel .5s cubic-bezier(.2,1.4,.4,1) both}
.hw-ribbon{position:absolute;top:-30px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap}
.hw-ribbon h2{position:relative;z-index:1;padding:8px 34px 10px;font:400 clamp(28px,8vw,36px)/1.1 var(--font-display);letter-spacing:.08em;color:#fff;
  background:linear-gradient(180deg,#FF7A5C,#E3402B);border:4px solid var(--btn-edge);border-radius:12px;box-shadow:0 6px 0 var(--btn-edge);
  text-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap;text-wrap:nowrap}
.hw-ribbon::before,.hw-ribbon::after{content:"";position:absolute;top:18px;width:44px;height:44px;background:#B02A18;border:4px solid var(--btn-edge);z-index:0}
.hw-ribbon::before{left:-30px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.hw-ribbon::after{right:-30px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.hw-ribbon.lose h2{background:linear-gradient(180deg,#7FB7FF,#3E7BD6)}
.hw-ribbon.lose::before,.hw-ribbon.lose::after{background:#2A5AA8}
.hw-result-k{font-size:14px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em}
.hw-result-who{font:400 22px/1.3 var(--font-display);letter-spacing:.04em}
.hw-bigstars{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin:4px 0 2px}
.hw-bstar{position:relative;display:grid;place-items:center}
.hw-bstar svg{width:clamp(62px,18vw,84px);height:clamp(62px,18vw,84px);overflow:visible}
.hw-bstar:nth-child(2) svg{width:clamp(80px,23vw,108px);height:clamp(80px,23vw,108px)}
.hw-bstar:nth-child(1){transform:rotate(-14deg) translateY(-2px)}.hw-bstar:nth-child(3){transform:rotate(14deg) translateY(-2px)}
.hw-bstar path{fill:var(--track);stroke:var(--btn-edge);stroke-width:1.6;stroke-linejoin:round}
.hw-bstar .on-l{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:hw-starpop .55s cubic-bezier(.2,1.8,.4,1) both;animation-delay:var(--d,0s)}
.hw-bstar .on-l path{fill:#FFD23F;stroke:var(--btn-edge)}
.hw-bstar .on-l::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:5px solid #FFE36E;opacity:0;animation:hw-ringout .7s ease-out both;animation-delay:var(--d,0s)}
.hw-rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.hw-rstat{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 6px;border-radius:16px;background:var(--paper-2);border:3px solid var(--line)}
.hw-rstat .k{font-size:13px;font-weight:700;color:var(--ink-soft)}
.hw-rstat .v{font:800 clamp(22px,6.6vw,30px)/1.2 var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.hw-rstat .rec{position:absolute;top:-12px;right:-6px;padding:0 8px;border-radius:999px;background:#E3402B;color:#fff;border:2.5px solid var(--btn-edge);font:800 12px/1.6 var(--font-body);transform:rotate(10deg);animation:hw-wiggle 1.6s ease-in-out infinite}
.hw-unlock{display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:16px;
  background:linear-gradient(180deg,var(--go-1),var(--go-2));color:#fff;border:3px solid var(--btn-edge);box-shadow:0 5px 0 var(--go-edge);
  font:800 19px/1.3 var(--font-body);text-shadow:0 2px 0 rgba(0,0,0,.35);animation:hw-popin .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:1.3s}
.hw-unlock .ic{font-size:26px;animation:hw-wiggle 1.4s ease-in-out infinite}
.hw-result-line{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hw-coinrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:6px 16px 6px 8px;border-radius:999px;background:var(--paper-2);border:3px solid var(--line);font-weight:700}
.hw-coinrow .hw-coin{width:40px;height:40px}
